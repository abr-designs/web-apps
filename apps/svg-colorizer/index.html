<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F1E6">
  <title>SVG Colorizer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="logo/logo.css">
</head>
<body>
  <img class="app-logo" src="logo/senor_claude.png" alt="">

  <header class="toolbar">
    <h1 class="brand">SVG Colorizer</h1>
    <label class="btn btn--accent">Choose photo<input id="file" class="visually-hidden" type="file" accept="image/*"></label>
    <label class="ctl">
      <span>Colors <output id="count-out"></output></span>
      <input id="count" type="range" min="2" max="20" step="1">
    </label>
    <label class="ctl">
      <span>Min piece size <output id="min-out"></output></span>
      <input id="min-piece" type="range" min="0" max="12" step="0.5">
    </label>
    <label class="ctl">
      <span>Smoothness <output id="smooth-out"></output></span>
      <input id="smooth" type="range" min="0" max="8" step="1">
    </label>
    <div class="ctl ctl--row">
      <label class="check"><input id="frame-on" type="checkbox"> Frame</label>
      <input id="frame-width" class="num" type="number" min="0.05" step="0.05" aria-label="Frame width">
      <span class="unit-label muted"></span>
    </div>
    <div class="ctl ctl--row">
      <label for="bridge-width">Bridge width</label>
      <input id="bridge-width" class="num" type="number" min="0.01" step="0.01">
      <span class="unit-label muted"></span>
    </div>
    <div class="ctl ctl--row">
      <label for="width">Width</label>
      <input id="width" class="num" type="number" min="1" step="0.5">
      <select id="unit" aria-label="Unit">
        <option value="in">in</option>
        <option value="cm">cm</option>
      </select>
      <span id="height-out" class="muted"></span>
    </div>
    <button id="export" class="btn btn--highlight" type="button">Export SVG</button>
  </header>

  <main class="preview">
    <div class="preview__bar">
      <div class="seg" role="group" aria-label="Preview shows">
        <button id="view-sheets" type="button" aria-pressed="true">Sheets</button>
        <button id="view-photo" type="button" aria-pressed="false">Photo</button>
      </div>
      <div class="seg">
        <button id="focus" type="button" aria-pressed="false" title="Paint areas whose detail must survive, like an eye">Focus</button>
      </div>
      <button id="focus-clear" class="link" type="button" hidden>Clear focus</button>
      <label class="ctl ctl--row brush-ctl">
        <span>Brush</span>
        <input id="brush" type="range" min="2" max="40" step="1" disabled>
        <output id="brush-out" class="muted"></output>
      </label>
      <p id="status" class="status" role="status"></p>
    </div>
    <div id="area" class="preview__area">
      <label id="empty" class="empty" for="file">
        <span class="empty__title">Start with a photo</span>
        <span class="muted">Drop an image here or choose one. It stays on your device.</span>
      </label>
      <div id="stage" class="stage" hidden>
        <div id="sheets-view" class="stage__layer"></div>
        <canvas id="photo-view" class="stage__layer" hidden></canvas>
        <canvas id="islands-view" class="stage__layer stage__islands"></canvas>
        <canvas id="paint-view" class="stage__layer stage__islands" hidden></canvas>
        <div id="brush-cursor" class="brush-cursor" hidden></div>
      </div>
    </div>
  </main>

  <aside class="layers">
    <div class="layers__head">
      <h2 class="layers__title">Sheets <span class="muted">front to back</span></h2>
      <button id="add-color" class="btn btn--small" type="button" disabled title="Pick a new sheet color from the photo">+ Add color</button>
    </div>
    <ol id="layers" class="layers__list"></ol>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
