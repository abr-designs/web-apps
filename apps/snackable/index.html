<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Snackable</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="feed" aria-live="polite"></main>

  <div id="strip" role="group" aria-label="Swipe up or tap for the next game, swipe down for the previous one">
    <div class="strip__now">
      <a id="now-link" class="strip__title" target="_blank" rel="noopener"></a>
      <span id="now-author" class="strip__sub"></span>
    </div>
    <button id="like-button" class="strip__button strip__like" type="button" aria-pressed="false" aria-label="Like this game">♥<span id="like-count" class="strip__count"></span></button>
    <button id="flag-button" class="strip__button" type="button" aria-label="Mark this game as broken">⚑</button>
    <button id="history-button" class="strip__button" type="button" aria-label="History">🕘</button>
    <div class="strip__next">
      <span class="strip__label">Next ↑</span>
      <span id="next-title" class="strip__sub"></span>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden>
    <span>Marked broken</span>
    <button id="toast-undo" type="button">Undo</button>
  </div>

  <section id="history" class="history" aria-label="History" hidden>
    <header class="history__header">
      <h2 class="history__heading">History</h2>
      <div class="history__views" role="group" aria-label="Show">
        <button class="history__view" type="button" data-view="all" aria-pressed="true">All</button>
        <button class="history__view" type="button" data-view="favorites" aria-pressed="false" aria-label="Favorites">♥</button>
      </div>
      <button id="history-close" class="strip__button" type="button" aria-label="Close history">✕</button>
    </header>
    <ol id="history-list" class="history__list"></ol>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
