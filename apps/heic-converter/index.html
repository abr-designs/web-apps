<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEIC Converter</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main>
    <h1>HEIC Converter</h1>
    <p class="intro">Batch convert HEIC/HEIF photos (and other images) to JPEG, PNG or WebP. Everything runs in your browser; nothing is uploaded.</p>
    <label id="drop-zone">
      <span>Drop images here, or click to choose</span>
      <input id="file-input" type="file" accept=".heic,.heif,image/*" multiple>
    </label>
    <div class="settings">
      <label>Format
        <select id="format">
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <label id="quality-field">Quality <output id="quality-value">0.9</output>
        <input id="quality" type="range" min="0.1" max="1" step="0.05" value="0.9">
      </label>
    </div>
    <p class="hint">Settings apply to files not yet converted. Use Reconvert all to redo existing files.</p>
    <div class="toolbar">
      <span id="summary" aria-live="polite"></span>
      <button type="button" id="reconvert" hidden>Reconvert all</button>
      <button type="button" id="clear" hidden>Clear</button>
      <button type="button" id="download-all" class="primary" hidden>Download all</button>
    </div>
    <progress id="progress" value="0" max="1" aria-label="Conversion progress" hidden></progress>
    <ul id="files"></ul>
  </main>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/heic-to.global.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
