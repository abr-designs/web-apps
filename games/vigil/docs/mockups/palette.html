<!doctype html>
<!-- Created by Claude (claude-opus-5-5) -->
<!-- Date: 2026-10-21 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil Palettes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #08090a; color: #e6e6e6; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 24px 16px 8px; max-width: 1180px; margin: 0 auto; }
    header h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .04em; }
    header p { margin: 0; color: #9a9a9a; }

    .palette { background: var(--bg); color: var(--text); padding: 28px 16px 36px; border-top: 1px solid #000; }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .palette h2 { margin: 0; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
    .palette h2 span { color: var(--accent); }
    .palette .blurb { margin: 4px 0 18px; color: var(--muted); max-width: 70ch; }

    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 22px; }
    .sw { background: var(--surface); border: 1px solid var(--raised); border-radius: 6px; overflow: hidden; }
    .sw .chip { height: 44px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .sw .meta { padding: 6px 8px; }
    .sw .role { font-size: 12px; color: var(--text); }
    .sw .hex { font: 12px/1.3 ui-monospace, Consolas, monospace; color: var(--muted); }

    .stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
    @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

    .panel { background: var(--surface); border: 1px solid var(--raised); border-radius: 8px; padding: 12px; }
    .panel h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    /* Top-down tactical grid sample */
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; aspect-ratio: 10 / 7; background: var(--bg); padding: 2px; border-radius: 4px; }
    .t { position: relative; background: var(--raised); border-radius: 2px; }
    .t.blue { background: color-mix(in srgb, var(--moveBlue) 34%, var(--raised)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--moveBlue) 70%, transparent); }
    .t.yellow { background: color-mix(in srgb, var(--moveYellow) 22%, var(--raised)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--moveYellow) 60%, transparent); }
    .t.detect { background: color-mix(in srgb, var(--danger) 26%, var(--raised)); }
    .t.wall { background: color-mix(in srgb, var(--text) 18%, var(--surface)); }
    .t.crate { background: color-mix(in srgb, var(--text) 10%, var(--surface)); }
    .t .unit { position: absolute; inset: 18%; border-radius: 50%; }
    .t .unit.x { background: var(--xcom); box-shadow: 0 0 0 2px var(--bg), 0 0 10px var(--xcom); }
    .t .unit.a { background: var(--alien); box-shadow: 0 0 0 2px var(--bg), 0 0 10px var(--alien); }
    .t .cv { position: absolute; width: 38%; height: 38%; }
    .t .cv svg { width: 100%; height: 100%; display: block; }
    .t .cv.n { top: -6%; left: 31%; } .t .cv.e { right: -6%; top: 31%; } .t .cv.w { left: -6%; top: 31%; } .t .cv.s { bottom: -6%; left: 31%; }
    .t.path::after { content: ""; position: absolute; left: 44%; top: 44%; width: 12%; height: 12%; border-radius: 50%; background: var(--moveBlue); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

    /* HUD samples */
    .hud { display: grid; gap: 14px; }
    .unitcard { display: grid; grid-template-columns: 48px 1fr; gap: 10px; background: var(--raised); border-left: 3px solid var(--xcom); border-radius: 4px; padding: 10px; }
    .portrait { width: 48px; height: 48px; border-radius: 4px; background: linear-gradient(160deg, color-mix(in srgb, var(--xcom) 55%, var(--surface)), var(--surface)); }
    .uname { font-weight: 600; letter-spacing: .03em; }
    .uclass { font-size: 12px; color: var(--muted); }
    .pips { display: flex; gap: 3px; margin: 6px 0 4px; }
    .pips b { width: 14px; height: 6px; background: var(--xcom); border-radius: 1px; }
    .pips b.lost { background: color-mix(in srgb, var(--text) 14%, transparent); }
    .ap { display: flex; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
    .ap b { width: 10px; height: 10px; transform: rotate(45deg); background: var(--accent); }
    .ap b.used { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
    .abilities { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .abil { font-size: 11px; padding: 5px 8px; border-radius: 3px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--text) 12%, transparent); }
    .abil.on { border-color: var(--accent); color: var(--accent); }
    .abil kbd { font: inherit; color: var(--muted); margin-right: 4px; }

    .shot { background: var(--raised); border-radius: 4px; padding: 10px; }
    .shot .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid color-mix(in srgb, var(--text) 10%, transparent); padding-bottom: 8px; margin-bottom: 8px; }
    .shot .tgt { font-weight: 600; }
    .shot .tgt small { display: block; font-weight: 400; color: var(--alien); font-size: 12px; }
    .shot .pct { font: 700 30px/1 ui-monospace, Consolas, monospace; color: var(--accent); text-align: right; }
    .shot .pct small { display: block; font-size: 11px; font-weight: 400; color: var(--crit); letter-spacing: .04em; margin-top: 4px; }
    .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
    .row .v { font-family: ui-monospace, Consolas, monospace; }
    .row .plus { color: var(--moveBlue); } .row .minus { color: var(--danger); } .row .critv { color: var(--crit); }
    .row.total { border-top: 1px solid color-mix(in srgb, var(--text) 10%, transparent); margin-top: 6px; padding-top: 6px; font-weight: 600; }
    .banner { margin-top: 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 6px 8px; border-radius: 3px; background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
    .banner.conceal { background: color-mix(in srgb, var(--xcom) 14%, transparent); color: var(--xcom); border-color: color-mix(in srgb, var(--xcom) 45%, transparent); }
  </style>
</head>
<body>
  <header>
    <h1>Vigil palette options</h1>
    <p>Three palettes for the tactical layer. Each shows the role swatches, a top-down slice of the battlefield (move ranges, cover, detection) and two HUD pieces: the unit card and the shot breakdown.</p>
  </header>
  <main id="palettes"></main>

  <script>
    // Static mockup content: each palette renders the same swatches, grid and HUD so they compare directly.
    const PALETTES = [
      {
        id: 'A', name: 'Command Cyan',
        blurb: 'Closest to the XCOM 2 mood. Deep blue-black command UI, cyan as the interactive colour, squad blue against alien red. Cover shields share the cyan family, so cover reads as "friendly information".',
        c: { bg: '#0B1118', surface: '#121C26', raised: '#1B2834', text: '#E6EEF4', muted: '#8A9BAA', accent: '#3FD0E8',
             xcom: '#4AA8FF', alien: '#E5484D', moveBlue: '#2F8CFF', moveYellow: '#F2C94C', danger: '#FF3B3B',
             halfCover: '#6E9BB8', fullCover: '#43C4F0', crit: '#FFB13B' }
      },
      {
        id: 'B', name: 'Field Amber',
        blurb: 'Warm resistance-camp feel. Olive charcoal surfaces with an amber accent, like a field terminal. Squad reads teal, aliens rust red. Cover shields are tan, so they sit on the terrain without competing with the move ranges.',
        c: { bg: '#12110D', surface: '#1C1A14', raised: '#28251C', text: '#EEE8D8', muted: '#9C9580', accent: '#E8A33D',
             xcom: '#5FB0C9', alien: '#D14B3C', moveBlue: '#3E8FD8', moveYellow: '#E8C547', danger: '#F0453A',
             halfCover: '#B9A66B', fullCover: '#E8C77A', crit: '#FF7A3D' }
      },
      {
        id: 'C', name: 'Blacksite Teal',
        blurb: 'Clinical and high-contrast. Neutral graphite with a mint-teal accent. Aliens are violet, which keeps red free for detection and danger only, so a red tile always means "you will be seen".',
        c: { bg: '#0D0F10', surface: '#16191B', raised: '#202427', text: '#E4E7E8', muted: '#8B9396', accent: '#2EE6A6',
             xcom: '#3FA9F5', alien: '#B656E0', moveBlue: '#2D7FF9', moveYellow: '#F5C542', danger: '#FF4D5E',
             halfCover: '#6FB7A6', fullCover: '#2EE6A6', crit: '#FFC24A' }
      }
    ];

    const ROLES = [
      ['bg', 'background'], ['surface', 'surface'], ['raised', 'surface-raised'], ['text', 'text'], ['muted', 'text-muted'],
      ['accent', 'accent'], ['xcom', 'xcom-team'], ['alien', 'alien-team'], ['moveBlue', 'move-blue (1 action)'],
      ['moveYellow', 'move-yellow (dash)'], ['danger', 'danger / detection-red'], ['halfCover', 'half-cover'],
      ['fullCover', 'full-cover'], ['crit', 'crit']
    ];

    // 10x7 slice. Codes: . floor, b blue range, y yellow range, d detection, W wall, C crate, X squad, A alien, p path dot.
    const MAP = [
      'yyyyyyy...',
      'ybbbbbyddd',
      'ybbpbbydAd',
      'ybbpWWyddd',
      'ybbXbbyCy.',
      'ybbbbbyyy.',
      'yyyyyyy...'
    ];
    // Cover markers: [row, col, side, kind]
    const COVER = [[4, 3, 'n', 'full'], [3, 3, 'e', 'full'], [4, 6, 'e', 'half'], [2, 8, 's', 'half']];

    const shield = (kind) => kind === 'full'
      ? '<svg viewBox="0 0 10 12"><path d="M5 0 10 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V2z" fill="var(--fullCover)"/></svg>'
      : '<svg viewBox="0 0 10 12"><path d="M5 0 10 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V2z" fill="none" stroke="var(--halfCover)" stroke-width="1.6"/><path d="M0 6h10c0 3-2.2 5-5 6-2.8-1-5-3-5-6z" fill="var(--halfCover)"/></svg>';

    const cls = { b: 'blue', y: 'yellow', d: 'detect', W: 'wall', C: 'crate', X: 'blue', A: 'detect', p: 'blue path' };

    function gridHtml() {
      let out = '';
      MAP.forEach((line, r) => [...line].forEach((ch, c) => {
        const covers = COVER.filter(([cr, cc]) => cr === r && cc === c)
          .map(([, , side, kind]) => `<span class="cv ${side}">${shield(kind)}</span>`).join('');
        const unit = ch === 'X' ? '<span class="unit x"></span>' : ch === 'A' ? '<span class="unit a"></span>' : '';
        out += `<div class="t ${cls[ch] || ''}">${unit}${covers}</div>`;
      }));
      return out;
    }

    function paletteHtml(p) {
      const vars = Object.entries(p.c).map(([k, v]) => `--${k}:${v}`).join(';');
      const swatches = ROLES.map(([k, role]) =>
        `<div class="sw"><div class="chip" style="background:${p.c[k]}"></div><div class="meta"><div class="role">${role}</div><div class="hex">${p.c[k]}</div></div></div>`).join('');
      return `
      <section class="palette" style="${vars}">
        <div class="wrap">
          <h2><span>${p.id}</span> &middot; ${p.name}</h2>
          <p class="blurb">${p.blurb}</p>
          <div class="swatches">${swatches}</div>
          <div class="stage">
            <div class="panel">
              <h3>Battlefield slice</h3>
              <div class="grid">${gridHtml()}</div>
              <div class="legend">
                <span><i style="background:var(--xcom)"></i>Squad</span>
                <span><i style="background:var(--alien)"></i>Alien</span>
                <span><i style="background:var(--moveBlue)"></i>1-action move</span>
                <span><i style="background:var(--moveYellow)"></i>Dash</span>
                <span><i style="background:var(--danger)"></i>Detection</span>
                <span><i style="background:var(--halfCover)"></i>Half cover</span>
                <span><i style="background:var(--fullCover)"></i>Full cover</span>
              </div>
            </div>
            <div class="panel hud">
              <div>
                <h3>Unit card</h3>
                <div class="unitcard">
                  <div class="portrait"></div>
                  <div>
                    <div class="uname">Sgt. R. Okafor</div>
                    <div class="uclass">Ranger &middot; Shotgun &middot; Aim 72</div>
                    <div class="pips"><b></b><b></b><b></b><b></b><b class="lost"></b><b class="lost"></b></div>
                    <div class="ap"><b></b><b class="used"></b>&nbsp;1 action left</div>
                    <div class="abilities">
                      <span class="abil on"><kbd>1</kbd>Shoot</span>
                      <span class="abil"><kbd>2</kbd>Overwatch</span>
                      <span class="abil"><kbd>3</kbd>Slash</span>
                      <span class="abil"><kbd>4</kbd>Hunker</span>
                      <span class="abil"><kbd>5</kbd>Frag</span>
                    </div>
                  </div>
                </div>
              </div>
              <div>
                <h3>Shot breakdown</h3>
                <div class="shot">
                  <div class="head">
                    <div class="tgt">ADVENT Trooper<small>4 / 4 HP &middot; Half cover</small></div>
                    <div class="pct">62%<small>CRIT 10%</small></div>
                  </div>
                  <div class="row"><span>Aim</span><span class="v">72</span></div>
                  <div class="row"><span>Range (close)</span><span class="v plus">+10</span></div>
                  <div class="row"><span>High ground</span><span class="v plus">+20</span></div>
                  <div class="row"><span>Half cover</span><span class="v minus">-20</span></div>
                  <div class="row"><span>Target defense</span><span class="v minus">-20</span></div>
                  <div class="row total"><span>Hit chance</span><span class="v">62</span></div>
                </div>
                <div class="banner conceal">Squad concealed</div>
                <div class="banner">Pod alerted &middot; 3 hostiles</div>
              </div>
            </div>
          </div>
        </div>
      </section>`;
    }

    document.getElementById('palettes').innerHTML = PALETTES.map(paletteHtml).join('');
  </script>
</body>
</html>
