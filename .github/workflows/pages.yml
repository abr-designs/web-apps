# Created by Claude (claude-opus-5-5)
# Date: 2026-09-30
#
# Tests the build scripts on every PR, then deploys main plus a preview of every app changed by an open PR to GitHub Pages.
# Every run rebuilds from the current state of main and the open PR list, whatever triggered it.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    # A closed PR has no merge ref to test; its run only rebuilds the site without it.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test build scripts
        run: node --test scripts/*.test.mjs

      - name: Validate apps
        run: node scripts/build-directory.mjs

  build:
    needs: test
    # Fork PRs cannot deploy, so their runs stop after the tests.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # Only the newest pending build is kept; it rebuilds everything, so skipping an older one loses nothing.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 --json number,title,url,updatedAt,headRefOid,isCrossRepository > "$RUNNER_TEMP/prs.json"

      - name: Build site
        run: node scripts/build-directory.mjs --out _site --dev "$RUNNER_TEMP/prs.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
